# ============================================================
# ProGemini Academy — Nginx Production Configuration
# Place this file at: /etc/nginx/sites-available/progemini
# Then: ln -sf /etc/nginx/sites-available/progemini /etc/nginx/sites-enabled/progemini
# ============================================================

# Upstream: the Next.js Docker container
upstream progemini_backend {
    server 127.0.0.1:3010 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    server_name progemini.academy www.progemini.academy;
    return 301 https://$server_name$request_uri;
}

# ── HTTPS main server ────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name progemini.academy www.progemini.academy;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/progemini.academy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/progemini.academy/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:CHACHA20;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── Client limits ────────────────────────────────────────
    client_max_body_size 50M;    # Allow file uploads up to 50MB

    # ── Next.js static assets — serve directly, cache forever ─
    # These are content-hashed so they never change for the same URL
    location /_next/static/ {
        proxy_pass http://progemini_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Aggressive caching for static assets (1 year)
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── Next.js image optimization ────────────────────────────
    # Sharp processing can take a few seconds for large images
    location /_next/image {
        proxy_pass http://progemini_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeout for image processing
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Cache optimized images at the Nginx layer (1 day)
        # This avoids hitting Next.js for every image on every request
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── Public static files (images in /public) ───────────────
    location /profile-image/ {
        proxy_pass http://progemini_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800" always; # 7 days
        access_log off;
    }

    location /campus-image/ {
        proxy_pass http://progemini_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location /mega-menu-icons/ {
        proxy_pass http://progemini_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ── Health check endpoint ─────────────────────────────────
    location /api/health {
        proxy_pass http://progemini_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        # No retry here — used to detect actual health
    }

    # ── General proxy — all other routes ─────────────────────
    location / {
        proxy_pass http://progemini_backend;
        proxy_http_version 1.1;

        # Required headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (for HMR / live features if needed)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Timeouts — generous for SSR pages
        proxy_connect_timeout  10s;
        proxy_send_timeout     90s;
        proxy_read_timeout     90s;

        # Retry on upstream errors/timeouts — crucial during container restarts
        # This prevents 502s reaching the user when Docker restarts the container
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries 2;

        # Buffer settings for SSR responses
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
    }
}
