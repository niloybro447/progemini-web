# ============================================================
# ProGemini Academy — Nginx Production Configuration
# Place this file at: /etc/nginx/sites-available/progemini
# Then: ln -sf /etc/nginx/sites-available/progemini /etc/nginx/sites-enabled/progemini
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx
# ============================================================

# Upstream: the Next.js Frontend Docker container
upstream progemini_frontend {
    server 127.0.0.1:3010 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Upstream: the Express Backend Docker container
upstream progemini_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ── Proxy Cache Paths (Next.js Image Optimization & MinIO Media) ──
proxy_cache_path /var/cache/nginx/next_images levels=1:2 keys_zone=next_images_cache:10m max_size=2g inactive=7d use_temp_path=off;
proxy_cache_path /var/cache/nginx/api_files levels=1:2 keys_zone=api_files_cache:10m max_size=5g inactive=30d use_temp_path=off;

# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    server_name progemini.academy www.progemini.academy;
    return 301 https://$server_name$request_uri;
}

# ── HTTPS main server ────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name progemini.academy www.progemini.academy;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/progemini.academy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/progemini.academy/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:CHACHA20;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── Client limits ────────────────────────────────────────
    client_max_body_size 50M;    # Allow file uploads up to 50MB

    # ── Next.js static build chunks (_next/static/) ──────────
    location /_next/static/ {
        proxy_pass http://progemini_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── Next.js Image Optimization with High-Speed Disk Caching ──
    location /_next/image {
        proxy_cache next_images_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=604800, immutable" always;

        proxy_pass http://progemini_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── MinIO / API Media File Downloads with Disk Caching ──
    location /api/v1/files/download/ {
        proxy_cache api_files_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;

        proxy_pass http://progemini_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     90s;
        proxy_read_timeout     90s;
    }

    # ── NextAuth Authentication Routes — handled by Next.js Frontend ──
    location /api/auth/ {
        proxy_pass http://progemini_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Express Backend API Routes ────────────────────────────
    location /api/ {
        proxy_pass http://progemini_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     90s;
        proxy_read_timeout     90s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries 2;
    }

    # ── Public Static Files (images, fonts, assets) ───────────
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
        proxy_pass http://progemini_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── General proxy — Next.js Frontend pages ────────────────
    location / {
        proxy_pass http://progemini_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout  10s;
        proxy_send_timeout     90s;
        proxy_read_timeout     90s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries 2;
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
    }
}
