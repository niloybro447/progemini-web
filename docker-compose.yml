services:
  # ─── Express Backend API ───────────────────────────────────────
  progemini-backend:
    container_name: progemini_backend
    image: progemini-backend:${BACKEND_TAG:-latest}
    build:
      context: ./progemini-backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - path: ./progemini-backend/.env
        required: true
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped
    networks:
      - progemini-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M

  # ─── Next.js Frontend ──────────────────────────────────────────
  progemini-app-prod:
    container_name: progemini_app_prod
    image: progemini:${PROD_TAG:-prod-latest}
    build:
      context: ./progemini-frontend
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=prod
    depends_on:
      progemini-backend:
        condition: service_healthy
    ports:
      - "3010:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    env_file:
      - path: ./progemini-frontend/.env.prod
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=1200
    restart: unless-stopped
    networks:
      - progemini-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M

networks:
  progemini-network:
    driver: bridge
