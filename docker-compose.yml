services:
  progemini-app-test:
    container_name: progemini_app_test
    image: progemini:${TEST_TAG:-test-latest}
    build:
      context: ./progemini-frontend
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=test
    ports:
      - "30001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./progemini-frontend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - progemini-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

  progemini-app-prod:
    container_name: progemini_app_prod
    image: progemini:${PROD_TAG:-prod-latest}
    build:
      context: ./progemini-frontend
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=prod
    # Host :3010 → app listens on 3000 inside the container (see Dockerfile EXPOSE)
    ports:
      - "3010:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    env_file:
      - path: ./progemini-frontend/.env.prod
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Allow Node.js to use up to 1.2GB heap (leave headroom for OS + sharp)
      - NODE_OPTIONS=--max-old-space-size=1200
    restart: unless-stopped
    networks:
      - progemini-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536M   # Increased from 512M — Next.js needs ≥1GB; sharp OOMs at 512M
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  progemini_data:

networks:
  progemini-network:
    driver: bridge
